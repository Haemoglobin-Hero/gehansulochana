<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Payment // SCIENCE</title><link rel="stylesheet" href="css/style.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-dot"></span>SCIENCE<span class="muted">//</span>CLASS</a><nav class="nav"><a href="classes.html">← Back to Classes</a></nav></header><main class="section-pad standalone-payment"><div class="payment-page-card"><span class="eyebrow">PAYMENT SUBMISSION</span><h1>Submit your <em>payment.</em></h1><p>Use this page if you opened the payment form directly.</p><form id="payment-form-standalone"><label>Student Name<input required name="student_name"></label><label>Student ID<input required name="student_id"></label><label>Class / Program<select required name="class_name"><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Rapid Revision 2026</option></select></label><label>Month<select required name="month"><option>January 2026</option><option>February 2026</option><option>March 2026</option><option>April 2026</option><option>May 2026</option><option>June 2026</option><option>July 2026</option><option>August 2026</option><option>September 2026</option><option>October 2026</option><option>November 2026</option><option>December 2026</option></select></label><div class="amount-box"><span>Amount to pay</span><strong id="payment-amount">LKR 0</strong></div><label>Payment slip / screenshot<input required type="file" name="slip" accept="image/*,.pdf"></label><button class="btn btn-primary full">Submit Payment →</button><div id="payment-status" class="form-status"></div></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script></body></html>
